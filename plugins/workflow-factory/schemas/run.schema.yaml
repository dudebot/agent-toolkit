$schema: "https://json-schema.org/draft/2020-12/schema"
title: WorkflowFactoryRun
type: object
required:
  - id
  - project_id
  - intent_path
  - status
  - created_at
  - artifacts
properties:
  id:
    type: string
  project_id:
    type: string
  project_dir:
    type: string
  control_root:
    type: string
  intent_id:
    type: string
  intent_path:
    type: string
  status:
    type: string
    enum: [started, ready, prompt_rendered, clarified, drafted, reviewed, finalized, blocked, completed]
  created_at:
    type: string
  updated_at:
    type: string
  completed_at:
    type: [string, "null"]
  runner:
    type: [string, "null"]
  stage:
    type: [string, "null"]
  source_paths:
    type: array
    items:
      type: string
  add_dirs:
    type: array
    items:
      type: string
  artifacts:
    type: array
    items:
      type: string
  preflight:
    type: [string, "null"]
  trace_ledger:
    type: string
  artifact_index:
    type: string
  telemetry:
    type: array
    items:
      type: string
  parent_run_id:
    type: [string, "null"]
  decisions:
    type: array
    items:
      type: string
  blockers:
    type: array
    items:
      type: string
additionalProperties: false
