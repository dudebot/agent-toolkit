$schema: "https://json-schema.org/draft/2020-12/schema"
title: ProjectRegistry
type: object
required:
  - projects
properties:
  projects:
    type: object
    additionalProperties:
      type: object
      required:
        - owner
        - repo
        - status
      properties:
        owner:
          type: string
        repo:
          type: string
        status:
          type: string
          enum: [active, active_ish, parked, incubating, archived]
        domain:
          type: string
        control_path:
          type: string
        notes:
          type: array
          items:
            type: string
      additionalProperties: false
additionalProperties: false
