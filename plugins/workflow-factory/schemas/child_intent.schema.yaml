$schema: "https://json-schema.org/draft/2020-12/schema"
title: ChildIntent
type: object
required:
  - id
  - title
  - parent_intent_id
  - reason
  - desired_outcome
  - recommended_action
  - approval_required
properties:
  id:
    type: string
  title:
    type: string
  parent_intent_id:
    type: string
  spawned_by_run:
    type: string
  reason:
    type: string
  desired_outcome:
    type: string
  must_not_happen:
    type: array
    items:
      type: string
  known_inputs:
    type: array
    items:
      type: string
  recommended_action:
    type: string
    enum: [accept, defer, reject, split, merge]
  priority_hint:
    type: string
    enum: [now, soon, later, someday]
  approval_required:
    type: boolean
additionalProperties: false
