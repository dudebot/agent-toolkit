$schema: "https://json-schema.org/draft/2020-12/schema"
title: WorkflowReview
type: object
required:
  - id
  - workflow_id
  - review_type
  - verdict
  - findings
properties:
  id:
    type: string
  workflow_id:
    type: string
  review_type:
    type: string
    enum: [adversarial, implementability, final_gate]
  verdict:
    type: string
    enum: [ready, ready_with_edits, revise, reject, runnable, runnable_with_edits, blocked, not_implementable]
  findings:
    type: array
    items:
      type: object
      required: [severity, summary, recommendation]
      properties:
        severity:
          type: string
          enum: [critical, high, medium, low]
        summary:
          type: string
        section:
          type: string
        recommendation:
          type: string
      additionalProperties: false
  required_edits:
    type: array
    items:
      type: string
  residual_risks:
    type: array
    items:
      type: string
additionalProperties: false
